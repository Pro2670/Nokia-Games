<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Nokia Arcade</title>
<style>
:root{
  --phone:#18202b; --phone2:#273142; --screen:#d9e86a; --screen2:#c8dc52;
  --ink:#18230e; --muted:#53602e; --accent:#7f8f30; --key:#202a38; --key2:#111823;
  --glow:rgba(215,232,106,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden !important;
  overscroll-behavior:none !important;
  touch-action:none !important;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;
  user-select:none;
}
body{
  position:fixed;
  inset:0;
  padding:0;
}
button,.phone,.screen,.screen-wrap,#view{
  touch-action:none;
  -webkit-touch-callout:none;
}
.icon{display:inline-block;position:relative;width:16px;height:16px}
.icon.up:before,.icon.down:before,.icon.left:before,.icon.right:before{
  content:"";position:absolute;left:50%;top:50%;width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
}
.icon.up:before{transform:translate(-50%,-65%);border-bottom:11px solid #e8edf5}
.icon.down:before{transform:translate(-50%,-35%);border-top:11px solid #e8edf5}
.icon.left:before{transform:translate(-65%,-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:11px solid #e8edf5}
.icon.right:before{transform:translate(-35%,-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #e8edf5}
.ok-dot{display:inline-block;width:14px;height:14px;border:2px solid #e8edf5;border-radius:50%;position:relative}
.ok-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#e8edf5}
.action-icon{display:inline-flex;width:18px;height:18px;border:2px solid #e8edf5;border-radius:5px;align-items:center;justify-content:center;font-size:9px;font-weight:900}
.status-icons{display:flex;align-items:center;gap:8px}
.signal-icon{display:inline-block;width:16px;height:13px;position:relative}
.signal-icon:before{content:"";position:absolute;bottom:0;left:0;width:3px;height:4px;background:var(--ink);box-shadow:4px -3px 0 var(--ink),8px -6px 0 var(--ink),12px -9px 0 var(--ink)}
.network-icon{font:700 9px monospace}
.battery-icon{display:flex;align-items:center;gap:3px;font:700 8px monospace}
.battery-icon i{display:block;width:19px;height:9px;border:1.5px solid var(--ink);border-radius:2px;position:relative}
.battery-icon i:after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--ink)}
.battery-icon i:before{content:"";position:absolute;left:1px;top:1px;width:var(--level,70%);max-width:15px;height:5px;background:var(--ink)}

html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:
radial-gradient(circle at 50% 10%,#34404d 0,#141922 58%,#090c11 100%);color:white}
body{display:flex;justify-content:center;align-items:center;padding:18px}
button{font:inherit}
#app{width:min(100%,520px);display:flex;justify-content:center}
.phone{
  width:min(94vw,390px); aspect-ratio:.52; max-height:94vh; position:relative;
  background:linear-gradient(145deg,var(--phone2),var(--phone));
  border:3px solid #090d13;border-radius:34px;padding:18px 14px 20px;
  box-shadow:0 25px 70px #000b, inset 2px 2px 4px #ffffff10;
}
.brand{height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;letter-spacing:1px}
.camera{position:absolute;top:28px;right:24px;width:9px;height:9px;border-radius:50%;background:#05080d;border:2px solid #3b4657}
.screen-wrap{height:43%;min-height:220px;border:4px solid #0b1017;border-radius:18px;background:#10161d;padding:7px;box-shadow:inset 0 0 18px #000}
.screen{
 height:100%;border-radius:10px;overflow:hidden;position:relative;color:var(--ink);
 background:linear-gradient(145deg,var(--screen),var(--screen2));
 box-shadow:inset 0 0 22px var(--glow);text-shadow:0 1px 0 #fff5;
}
.screen::after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#00000008 0,#00000008 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}.screen.scan-off::after{display:none}

.lcd-softkeys{position:absolute;left:10px;right:10px;bottom:4px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font:900 10px monospace}
.lcd-softkeys span{text-align:center;padding:3px 1px;overflow:hidden;white-space:nowrap}
.key-bar{display:block;width:23px;height:3px;border-radius:3px;background:#d8dfeb;margin:auto}
.menu-window{height:calc(100% - 22px);overflow:hidden}
.list{height:100%;overflow:hidden;padding:2px}
.list .item{scroll-margin:4px}
.status .network{font:900 9px monospace}

.status{height:30px;padding:8px 10px 0;display:flex;justify-content:space-between;font:700 12px monospace}
#view{height:calc(100% - 30px);padding:8px 12px;position:relative;z-index:2}
.home{text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center;gap:15px}
.home .date{font:bold 14px monospace}.home .clock{font:900 22px monospace}
.logo{font-size:30px;font-weight:1000;letter-spacing:-2px}.sub{font:700 11px monospace}
.list{height:100%;overflow:auto;padding:2px}.title{font:bold 17px monospace;margin-bottom:8px}
.item{padding:8px 9px;margin:4px 0;border:2px solid transparent;border-radius:5px;font:bold 12px monospace;cursor:pointer}
.item.sel{background:#1f2b13;color:var(--screen);border-color:#1f2b13}
.helptext{font:700 11px/1.45 monospace;white-space:pre-wrap}
.setting{display:flex;align-items:center;justify-content:space-between;font:bold 11px monospace;padding:7px 0;border-bottom:1px solid #53602e}
.swatches{display:flex;gap:5px}.sw{width:22px;height:18px;border:2px solid #222;cursor:pointer}.sw.active{outline:2px solid white}
.canvasbox{height:100%;display:flex;align-items:center;justify-content:center}
canvas.game{width:100%;height:100%;image-rendering:pixelated;border:2px solid #273313;background:#b9cf48}
#touch{position:absolute;left:0;right:0;bottom:0;height:45%;display:none;z-index:10}
.touch-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;height:100%;padding:15px}
.tbtn{background:#ffffff10;border:2px solid #fff3;border-radius:12px;color:#fff8;font-size:22px;backdrop-filter:blur(2px)}
.tbtn:active{background:#fff3}
.controls{margin-top:13px}
.softkeys{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;margin:0 12px 8px}
.key{
 height:48px;border:2px solid #111923;border-radius:14px;color:#e8edf5;
 background:linear-gradient(#2c3747,#17202d);box-shadow:0 4px 0 #080c12, inset 0 1px #ffffff12;
 cursor:pointer;font-weight:900;font-size:11px
}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #080c12}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,38px);gap:5px;justify-content:center;margin:8px auto}
.dpad .key{font-size:17px;height:auto;padding:0}
.dpad .blank{visibility:hidden}
.numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 16px}
.num{height:37px;font-size:13px}.enter{grid-column:2}
.footer{color:#9da8b7;text-align:center;font-size:9px;margin-top:5px}
.modal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;border-radius:30px}
.modal.open{display:flex}.modal-card{width:82%;background:#1c2634;border:2px solid #566276;border-radius:16px;padding:15px;box-shadow:0 15px 40px #000}
.modal-card h3{margin:0 0 10px}.modal-card p{font-size:12px;line-height:1.4;color:#d5dbe3}
.modal-card button{width:100%;padding:10px;border:0;border-radius:9px;background:#d9e86a;color:#18230e;font-weight:900}
@media (min-width:700px){body{padding:0}.phone{width:390px}}
@media (max-height:700px){.phone{height:96vh;aspect-ratio:auto}.screen-wrap{height:40%}.controls{margin-top:7px}.dpad{margin:4px auto}.num{height:30px}}
</style>
</head>
<body>
<div id="app">
<div class="phone">
 <div class="brand">NOKIA</div><div class="camera"></div>
 <div class="screen-wrap">
  <div class="screen">
   <div class="status"><span class="status-icons"><i class="signal-icon" aria-label="signal"></i><i class="network-icon network" id="network">--</i></span>
<span class="battery-icon" aria-label="battery"><i></i><b>88%</b></span></div>
   <div id="view"></div>
  </div>
 </div>
 <div class="controls">
  <div class="softkeys">
   <button class="key" id="leftKey" aria-label="left soft key"><span class="key-bar"></span></button>
   <button class="key" id="okKey" aria-label="OK / menu key"><span class="key-bar"></span></button>
   <button class="key" id="rightKey" aria-label="right soft key"><span class="key-bar"></span></button>
  </div>
  <div class="dpad">
   <button class="key blank"></button><button class="key" data-key="ArrowUp"><span class="icon up" aria-hidden="true"></span></button><button class="key blank"></button>
   <button class="key" data-key="ArrowLeft"><span class="icon left" aria-hidden="true"></span></button><button class="key" data-key="Enter"><span class="ok-dot" aria-hidden="true"></span></button><button class="key" data-key="ArrowRight"><span class="icon right" aria-hidden="true"></span></button>
   <button class="key blank"></button><button class="key" data-key="ArrowDown"><span class="icon down" aria-hidden="true"></span></button><button class="key blank"></button>
  </div>
  <div class="numgrid">
   <button class="key num" data-key="1">1</button><button class="key num" data-key="2">2</button><button class="key num" data-key="3">3</button>
   <button class="key num" data-key="4">4</button><button class="key num" data-key="5">5</button><button class="key num" data-key="6">6</button>
   <button class="key num" data-key="7">7</button><button class="key num" data-key="8">8</button><button class="key num" data-key="9">9</button>
   <button class="key num">*</button><button class="key num" data-key="0">0</button><button class="key num">#</button>
  </div>
  <div class="footer">RETRO ARCADE • Touch + Keyboard • ESC = Back</div>
 </div>
</div>
</div>
</div>

<script>
"use strict";

// Lock the arcade viewport: no page scroll, pinch zoom, double-tap zoom, or browser gestures.
document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
document.addEventListener("gesturestart", e => e.preventDefault(), {passive:false});
document.addEventListener("gesturechange", e => e.preventDefault(), {passive:false});
document.addEventListener("gestureend", e => e.preventDefault(), {passive:false});
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 320) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

const $=s=>document.querySelector(s), view=$("#view");
let state="home", menuIndex=0, game=null, raf=0, settings={theme:"lime",sfx:true,vfx:true,scan:true};
const themes={
 lime:["#d9e86a","#c8dc52","#18230e","#53602e"],blue:["#8fe8ff","#52c7dc","#06202a","#1c5965"],
 amber:["#ffe28a","#e9bb45","#2a2008","#705b20"],mono:["#d8d8d8","#aaa","#171717","#555"]
};
function applyTheme(){
  let t=themes[settings.theme];
  document.documentElement.style.setProperty("--screen",t[0]);
  document.documentElement.style.setProperty("--screen2",t[1]);
  document.documentElement.style.setProperty("--ink",t[2]);
  document.documentElement.style.setProperty("--muted",t[3]);
  $(".screen")?.classList.toggle("scan-off",!settings.scan);
}
applyTheme();

function beep(freq=440,dur=.045){if(!settings.sfx)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type="square";g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.stop(a.currentTime+dur)}catch{}}
let settingsIndex=0;
let batteryManager=null;

function lcdKeys(labels="HELP|MENU|SET"){
  return `<div class="lcd-softkeys">${labels.split("|").map(x=>`<span>${x}</span>`).join("")}</div>`;
}


async function updateDeviceStatus(){
  const battery=$("#battery");
  const network=$("#network");
  if(battery){
    battery.innerHTML='<i></i><b>--%</b>';
    if("getBattery" in navigator){
      try{
        batteryManager=await navigator.getBattery();
        const paint=()=>{
          const pct=Math.round(batteryManager.level*100);
          battery.innerHTML=`<i style="--level:${pct}%"></i><b>${pct}%${batteryManager.charging?" +":""}</b>`;
        };
        paint();
        batteryManager.addEventListener("levelchange",paint);
        batteryManager.addEventListener("chargingchange",paint);
      }catch{}
    }
  }
  const paintNetwork=()=>{
    if(!network)return;
    if(!navigator.onLine){network.textContent="OFF";return}
    const c=navigator.connection;
    if(c?.type==="wifi"){network.textContent="WIFI";return}
    if(c?.type==="cellular"){
      // Browsers generally expose "cellular" but not the exact radio generation.
      network.textContent=(c.effectiveType||"CELL").toUpperCase();
      return;
    }
    if(c?.type==="ethernet"){network.textContent="LAN";return}
    network.textContent=c?.effectiveType ? c.effectiveType.toUpperCase() : "ON";
  };
  paintNetwork();
  window.addEventListener("online",paintNetwork);
  window.addEventListener("offline",paintNetwork);
  navigator.connection?.addEventListener?.("change",paintNetwork);
}

function home(){
  stopGame(); state="home";
  view.innerHTML=`<div class="home">
    <div class="logo">NOKIA</div><div class="sub">RETRO ARCADE</div>
    <div class="date">${new Date().toDateString()}</div>
    <div class="clock" id="clock"></div>
    ${lcdKeys()}
  </div>`;
  $("#leftKey").setAttribute("aria-label","Help");
  $("#okKey").setAttribute("aria-label","Menu");
  $("#rightKey").setAttribute("aria-label","Settings");
  const tick=()=>{let c=$("#clock");if(c)c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})};
  tick(); clearInterval(window._clockTimer); window._clockTimer=setInterval(tick,500);
  updateDeviceStatus();
}

function menu(){
  stopGame(); state="menu"; menuIndex=0; renderMenu();
}
function renderMenu(){
  view.innerHTML=`<div class="menu-window"><div class="list" id="gameList">
    <div class="title">GAMES</div>
    ${games.map((g,i)=>`<div class="item ${i===menuIndex?"sel":""}" data-i="${i}">${String(i+1).padStart(2,"0")} • ${g}</div>`).join("")}
  </div></div>${lcdKeys("BACK|SELECT|HELP")}`;
  const selected=view.querySelector(".item.sel");
  if(selected) selected.scrollIntoView({block:"nearest"});
  view.querySelectorAll(".item").forEach(x=>x.onclick=()=>{menuIndex=+x.dataset.i;startGame(menuIndex)});
}

function settingsMenu(){
  stopGame(); state="settings"; settingsIndex=0; renderSettings();
}
function renderSettings(){
  const names=["SCREEN","SOUNDS / SFX","VFX / FLASH","SCANLINES"];
  view.innerHTML=`<div class="menu-window"><div class="list" id="settingsList">
    <div class="title">SETTINGS</div>
    ${names.map((name,i)=>{
      let value=i===0
        ? `<span class="swatches">${Object.keys(themes).map(k=>`<button class="sw ${settings.theme===k?"active":""}" style="background:${themes[k][0]}" data-theme="${k}"></button>`).join("")}</span>`
        : `<b>${i===1?(settings.sfx?"ON":"OFF"):i===2?(settings.vfx?"ON":"OFF"):(settings.scan?"ON":"OFF")}</b>`;
      return `<div class="setting ${i===settingsIndex?"setting-sel":""}" data-setting="${i}"><span>${name}</span>${value}</div>`;
    }).join("")}
  </div></div>${lcdKeys("BACK|CHANGE|HELP")}`;
  const selected=view.querySelector(".setting-sel");
  if(selected) selected.scrollIntoView({block:"nearest"});
  view.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{settings.theme=b.dataset.theme;applyTheme();renderSettings()});
  view.querySelectorAll("[data-setting]").forEach(b=>b.onclick=()=>{settingsIndex=+b.dataset.setting;activateSetting()});
}
function activateSetting(){
  if(settingsIndex===0){
    const keys=Object.keys(themes), n=keys.indexOf(settings.theme);
    settings.theme=keys[(n+1)%keys.length]; applyTheme();
  } else if(settingsIndex===1) settings.sfx=!settings.sfx;
  else if(settingsIndex===2) settings.vfx=!settings.vfx;
  else if(settingsIndex===3) settings.scan=!settings.scan;
  renderSettings();
}

function help(){
  stopGame(); state="help";
  view.innerHTML=`<div class="menu-window"><div class="list"><div class="title">HELP / CONTROLS</div><div class="helptext">
ARCADE CONTROLS
D-PAD / ARROW KEYS = move
OK / ENTER         = select
LEFT / RIGHT       = soft keys
A / SPACE          = action
ESC                = back

PHONE
Tap the physical-looking
buttons below the LCD.
There is NO touchscreen
control layer over the LCD.

GAMES
Snake: steer the snake.
Pong: up/down moves paddle.
Flappy Bird: A/OK flaps.
Breakout: left/right moves paddle.
Tetris: left/right/down, A rotate.
Space Invaders: left/right + A.
Minesweeper: arrows + OK.
2048: arrows.
Road Racer: left/right.
Simon Says: 1-4.

Use the D-pad to navigate
every menu and setting.
</div></div></div>${lcdKeys("BACK|HOME|BACK")}`;
}

const games=["Snake","Pong","Flappy Bird","Breakout","Tetris","Space Invaders","Minesweeper","2048","Road Racer","Simon Says"];
function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;game=null}
function startGame(i){stopGame();state="game";["snake","pong","flappy","breakout","tetris","invaders","mines","2048","racer","simon"][i]();$("#leftKey").textContent="Back";$("#okKey").textContent="Pause";$("#rightKey").textContent="Restart"}

function makeCanvas(){view.innerHTML='<div class="canvasbox"><canvas class="game" id="c" width="240" height="190"></canvas></div>';return $("#c").getContext("2d")}
function txt(c,s,x,y,size=10){c.font=`bold ${size}px monospace`;c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink");c.fillText(s,x,y)}
function keyName(k){return k}

function snake(){
 const c=makeCanvas(),W=20,H=15;let s=[[10,7],[9,7],[8,7]],d=[1,0],next=d,food=[15,7],score=0,last=0;
 function draw(t){c.clearRect(0,0,240,190);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--screen2");c.fillRect(0,0,240,190);let cw=12,ch=12;
 s.forEach((p,i)=>{c.fillStyle=i?"#2d4612":"#17240b";c.fillRect(p[0]*cw,p[1]*ch,cw-1,ch-1)});c.fillStyle="#17240b";c.fillRect(food[0]*cw,food[1]*ch,cw-1,ch-1);txt(c,"SCORE "+score,165,12,9);
 if(t-last>125){last=t;d=next;let h=[s[0][0]+d[0],s[0][1]+d[1]];if(h[0]<0||h[0]>=W||h[1]<0||h[1]>=H||s.some(p=>p[0]===h[0]&&p[1]===h[1])){s=[[10,7],[9,7],[8,7]];score=0;beep(120,.12)}else{s.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;beep(660);do food=[Math.floor(Math.random()*W),Math.floor(Math.random()*H)];while(s.some(p=>p[0]===food[0]&&p[1]===food[1]))}else s.pop()}}raf=requestAnimationFrame(draw)}raf=requestAnimationFrame(draw);
 game={restart:snake}}
function pong(){const c=makeCanvas();let py=75,by=95,bx=120,vx=2.1,vy=1.4,ai=75,p=0,q=0,last=0;
 function draw(t){c.clearRect(0,0,240,190);c.setLineDash([4,4]);c.strokeStyle="#334514";c.beginPath();c.moveTo(120,0);c.lineTo(120,190);c.stroke();c.setLineDash([]);c.fillStyle="#18230e";c.fillRect(7,py,5,38);c.fillRect(228,ai,5,38);c.fillRect(bx,by,6,6);txt(c,`${p}     ${q}`,102,14,12);
 if(t-last>16){last=t;by+=vy;bx+=vx;py=Math.max(0,Math.min(152,py));ai+=((by-19)-ai)*.06;if(by<=0||by>=184)vy*=-1;if(bx<14&&by+6>py&&by<py+38)vx=Math.abs(vx)+.02;if(bx>222&&by+6>ai&&by<ai+38)vx=-Math.abs(vx)-.02;if(bx<0){q++;bx=120;by=95;vx=2.1;vy=1.4}if(bx>240){p++;bx=120;by=95;vx=-2.1;vy=1.4}}raf=requestAnimationFrame(draw)}raf=requestAnimationFrame(draw);game={restart:pong}}
function flappy(){const c=makeCanvas();let y=90,vy=0,obs=[],score=0,last=0,dead=false,spawn=0;
 function flap(){if(dead){flappy();return}vy=-4.2;beep(700)}
 function draw(t){c.clearRect(0,0,240,190);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--screen2");c.fillRect(0,0,240,190);if(!dead){vy+=.22;y+=vy;if(t-spawn>1300){spawn=t;let gap=55,top=20+Math.random()*75;obs.push({x:240,top,gap,hit:false})}obs.forEach(o=>o.x-=1.8);obs=obs.filter(o=>o.x>-30);for(let o of obs){c.fillStyle="#273912";c.fillRect(o.x,0,24,o.top);c.fillRect(o.x,o.top+o.gap,24,190);if(!o.hit&&o.x+24<58){o.hit=true;score++;beep(550)}}if(y<0||y>184||obs.some(o=>58>o.x&&58<o.x+24&&(y<o.top||y>o.top+o.gap)))dead=true}c.fillStyle="#1b2a0e";c.fillRect(55,y,12,9);txt(c,"SCORE "+score,8,13,9);if(dead)txt(c,"GAME OVER • A TO RESTART",45,95,11);raf=requestAnimationFrame(draw)}raf=requestAnimationFrame(draw);game={restart:flappy,action:flap}}
function breakout(){const c=makeCanvas();let px=100,bx=120,by=160,vx=1.7,vy=-2,br=[],score=0;for(let r=0;r<4;r++)for(let col=0;col<9;col++)br.push({x:10+col*25,y:20+r*10,on:1});

function tetris(){const c=makeCanvas();let grid=Array.from({length:20},()=>Array(10).fill(0)),x=3,y=0,rot=0,score=0,last=0,shape=[[1,1,1,1],[1,1,0,0],[0,1,1,0],[1,1,1,0]][Math.floor(Math.random()*4)];function cells(){return shape.map((r,yy)=>r.map((v,xx)=>v?[x+xx,y+yy]:null).filter(Boolean)).flat()}

function game2048(){const c=makeCanvas();let a=Array.from({length:4},()=>Array(4).fill(0));function add(){let z=[];a.forEach((r,y)=>r.forEach((v,x)=>{if(!v)z.push([x,y])}));if(z.length){let [x,y]=z[Math.floor(Math.random()*z.length)];a[y][x]=Math.random()<.9?2:4}}add();add();function move(k){let rot=0;if(k==="ArrowLeft")rot=0;if(k==="ArrowUp")rot=1;if(k==="ArrowRight")rot=2;if(k==="ArrowDown")rot=3;for(let i=0;i<rot;i++)a=a[0].map((_,i)=>a.map(r=>r[i]).reverse());a=a.map(r=>{let q=r.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;q.splice(i+1,1)}while(q.length<4)q.push(0);return q});for(let i=0;i<(4-rot)%4;i++)a=a[0].map((_,i)=>a.map(r=>r[i]).reverse());add();beep(300)}

function simon(){const c=makeCanvas();let seq=[],input=[],round=0,phase="";function next(){seq.push(Math.floor(Math.random()*4));input=[];round++;phase="WATCH";beep(300+seq[seq.length-1]*100)}function draw(){c.clearRect(0,0,240,190);let cols=[[20,20],[125,20],[20,105],[125,105]];cols.forEach((p,i)=>{c.strokeRect(p[0],p[1],95,75);txt(c,String(i+1),p[0]+45,p[1]+43,20)});txt(c,"ROUND "+round+" • "+phase,72,13,8);raf=requestAnimationFrame(draw)}next();draw();game={restart:simon,action(i=0){if(phase==="WATCH"){phase="PLAY";return}input.push(i);beep(350+i*80);if(input[input.length-1]!==seq[input.length-1]){round=0;seq=[];phase="FAIL";setTimeout(next,700)}else if(input.length===seq.length){phase="NEXT";setTimeout(next,600)}}}}
function pause(){if(state!=="game")return;$("#modalText").textContent="Press Continue to keep playing, or use Restart to reset the game.";$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
function restart(){if(state==="game"&&game?.restart)game.restart()}
function back(){if(state==="game"||state==="help"||state==="settings"||state==="menu")home();else home()}
function handleKey(k){
  if(state==="home"){
    if(k==="Enter") menu();
    return;
  }

  if(state==="menu"){
    if(k==="ArrowUp"){
      menuIndex=(menuIndex+games.length-1)%games.length; renderMenu();
    } else if(k==="ArrowDown"){
      menuIndex=(menuIndex+1)%games.length; renderMenu();
    } else if(k==="Enter"){
      startGame(menuIndex);
    } else if(k==="Escape"){
      home();
    } else if(/^[1-9]$/.test(k)){
      let n=+k-1; if(n<games.length) startGame(n);
    }
    return;
  }

  if(state==="settings"){
    if(k==="ArrowUp"){
      settingsIndex=(settingsIndex+3)%4; renderSettings();
    } else if(k==="ArrowDown"){
      settingsIndex=(settingsIndex+1)%4; renderSettings();
    } else if(k==="ArrowLeft" && settingsIndex===0){
      const keys=Object.keys(themes), n=keys.indexOf(settings.theme);
      settings.theme=keys[(n-1+keys.length)%keys.length]; applyTheme(); renderSettings();
    } else if(k==="ArrowRight" && settingsIndex===0){
      const keys=Object.keys(themes), n=keys.indexOf(settings.theme);
      settings.theme=keys[(n+1)%keys.length]; applyTheme(); renderSettings();
    } else if(k==="Enter" || k==="Space"){
      activateSetting();
    } else if(k==="Escape"){
      home();
    }
    return;
  }

  if(state==="help"){
    if(k==="Escape" || k==="Enter") home();
    return;
  }

  if(state==="game" && game){
    if(k==="Escape"){home();return}
    if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown") game.move?.(k);
    if(k==="Enter"||k==="Space"||k==="a"||k==="A") game.action?.(0);
    if(k==="r"||k==="R") restart();
    if(/^[1-4]$/.test(k)) game.action?.(+k-1);
  }
}

document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Enter"].includes(e.key))e.preventDefault();handleKey(e.key===" "?"Space":e.key)});
document.querySelectorAll("[data-key]").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();handleKey(b.dataset.key)})});
$("#leftKey").onclick=()=>state==="home"?help():state==="menu"||state==="settings"||state==="help"?home():back();
$("#okKey").onclick=()=>state==="home"?menu():state==="game"?pause():state==="menu"?startGame(menuIndex):state==="settings"?activateSetting():home();
$("#rightKey").onclick=()=>state==="home"?settingsMenu():state==="game"?restart():back();
home();
